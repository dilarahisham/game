<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>play me 🎮</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-deep:#182F38;
    --bg:#264653;
    --panel:#152128;
    --gold:#F4B942;
    --red:#CE1126;
    --cream:#FBF6EC;
    --cream-dim: rgba(251,246,236,0.72);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{
    font-family:'Work Sans', sans-serif;
    color:var(--cream);
    min-height:100vh;
    overflow-x:hidden;
    -webkit-font-smoothing:antialiased;
    position:relative;
  }

  /* ---------- GAME-WORLD BACKGROUND ---------- */
  #world{
    position:fixed; inset:0;
    background:
      radial-gradient(ellipse at 50% -10%, var(--bg) 0%, var(--bg-deep) 65%);
    z-index:0;
    overflow:hidden;
  }
  .stars{
    position:absolute; inset:0;
    background-image:
      radial-gradient(1.5px 1.5px at 20px 30px, rgba(251,246,236,0.55) 50%, transparent 51%),
      radial-gradient(1.5px 1.5px at 90px 120px, rgba(251,246,236,0.4) 50%, transparent 51%),
      radial-gradient(1px 1px at 150px 60px, rgba(251,246,236,0.5) 50%, transparent 51%),
      radial-gradient(1.5px 1.5px at 210px 160px, rgba(251,246,236,0.35) 50%, transparent 51%),
      radial-gradient(1px 1px at 260px 40px, rgba(251,246,236,0.5) 50%, transparent 51%),
      radial-gradient(1.5px 1.5px at 320px 190px, rgba(251,246,236,0.4) 50%, transparent 51%);
    background-repeat:repeat;
    background-size:360px 220px;
    animation:driftStars 40s linear infinite;
    opacity:0.9;
  }
  @keyframes driftStars{
    from{ background-position:0 0; }
    to{ background-position:-360px 220px; }
  }
  .sparkle{
    position:absolute;
    font-size:16px;
    color:var(--gold);
    opacity:0.85;
    animation:floatUp 9s ease-in infinite;
  }
  @keyframes floatUp{
    0%{ transform:translateY(0) rotate(0deg); opacity:0; }
    10%{ opacity:0.9; }
    90%{ opacity:0.7; }
    100%{ transform:translateY(-110vh) rotate(30deg); opacity:0; }
  }
  .ground{
    position:absolute; left:0; right:0; bottom:0; height:34px;
    background:repeating-linear-gradient(
      90deg,
      #1F3944 0px, #1F3944 16px,
      #223f4b 16px, #223f4b 32px
    );
    box-shadow:0 -3px 0 rgba(244,185,66,0.5);
  }

  /* ---------- TAP LAYER ---------- */
  #tapLayer{
    position:fixed; inset:0;
    display:flex; align-items:center; justify-content:center;
    background:var(--bg-deep);
    z-index:50;
    cursor:pointer;
    transition:opacity .5s ease, visibility .5s ease;
  }
  #tapLayer.hide{ opacity:0; visibility:hidden; pointer-events:none; }
  #tapLayer p{
    font-family:'Baloo 2', sans-serif;
    font-weight:800;
    font-size:clamp(28px, 8vw, 40px);
    letter-spacing:.01em;
    text-align:center;
    animation:pulse 1.6s ease-in-out infinite;
  }
  @keyframes pulse{
    0%,100%{ transform:scale(1); }
    50%{ transform:scale(1.05); }
  }

  /* ---------- MAIN PAGE ---------- */
  main{
    position:relative;
    z-index:2;
    width:100%;
    max-width:440px;
    margin:0 auto;
    padding:40px 22px 70px;
    display:flex;
    flex-direction:column;
    align-items:center;
    text-align:center;
  }

  .blob-frame{
    width:170px; height:170px;
    overflow:hidden;
    border-radius:62% 38% 55% 45% / 48% 55% 45% 52%;
    animation:morph 8s ease-in-out infinite;
    box-shadow:0 16px 40px rgba(0,0,0,0.4), 0 0 0 4px var(--gold);
    background:var(--bg);
    margin-bottom:22px;
  }
  @keyframes morph{
    0%,100%{ border-radius:62% 38% 55% 45% / 48% 55% 45% 52%; }
    33%{ border-radius:45% 55% 40% 60% / 60% 40% 60% 40%; }
    66%{ border-radius:55% 45% 62% 38% / 42% 58% 42% 58%; }
  }
  .blob-frame video{
    width:100%; height:100%;
    object-fit:cover;
  }

  /* ---------- GAME PANEL ---------- */
  .panel{
    position:relative;
    width:100%;
    background:var(--panel);
    border:3px solid var(--gold);
    border-radius:20px;
    padding:24px 18px 22px;
    box-shadow:0 14px 30px rgba(0,0,0,0.35);
  }
  .panel::before, .panel::after{
    content:"✦";
    position:absolute;
    color:var(--gold);
    font-size:14px;
  }
  .panel::before{ top:-9px; left:14px; }
  .panel::after{ bottom:-9px; right:14px; }

  h1{
    font-family:'Baloo 2', sans-serif;
    font-weight:800;
    font-size:clamp(19px, 6vw, 23px);
    line-height:1.3;
    margin-bottom:6px;
    letter-spacing:.02em;
  }
  h1 span{ color:var(--gold); }

  p.hint{
    font-family:'Work Sans', sans-serif;
    font-size:13.5px;
    line-height:1.5;
    color:var(--cream-dim);
    margin-bottom:14px;
  }

  /* ---------- GAME AREA ---------- */
  #gameArea{ width:100%; transition:opacity .5s ease; }
  #gameArea.fading{ opacity:0; }
  #gameSvg{ width:100%; height:auto; display:block; touch-action:none; user-select:none; }
  .dot-line{
    stroke:var(--gold);
    stroke-width:3;
    fill:none;
    stroke-linecap:round;
    opacity:0.9;
  }
  .live-line{
    stroke:var(--gold);
    stroke-width:3;
    stroke-linecap:round;
    stroke-dasharray:5 5;
    opacity:0.75;
  }
  .dot circle{
    fill:rgba(251,246,236,0.06);
    stroke:var(--gold);
    stroke-width:2.5;
    transition:fill .18s ease, transform .18s ease;
  }
  .dot text{
    fill:var(--cream);
    font-family:'Baloo 2', sans-serif;
    font-size:13px;
    font-weight:700;
    text-anchor:middle;
    dominant-baseline:middle;
    pointer-events:none;
  }
  .dot{ transform-origin:center; }
  .dot.done circle{ fill:var(--gold); stroke:var(--red); }
  .dot.done text{ fill:var(--panel); }

  p.progress{
    font-family:'Baloo 2', sans-serif;
    font-weight:600;
    font-size:13px;
    color:var(--gold);
    margin-top:10px;
    letter-spacing:.02em;
  }

  .controls{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:16px;
    margin-top:22px;
  }

  .sound-toggle{
    display:inline-flex;
    align-items:center;
    gap:8px;
    background:rgba(251,246,236,0.08);
    border:1px solid rgba(251,246,236,0.3);
    color:var(--cream);
    font-family:'Work Sans', sans-serif;
    font-size:13px;
    padding:8px 16px;
    border-radius:999px;
    cursor:pointer;
  }
  .sound-toggle:active{ transform:scale(0.97); }

  /* ---------- FULLSCREEN BURST + RESULT ---------- */
  #fullscreenBurst{
    position:fixed; inset:0;
    z-index:70;
    pointer-events:none;
    background-color:rgba(21,33,40,0);
    transition:background-color 2.2s ease;
  }
  #fullscreenBurst.darken{ background-color:rgba(21,33,40,0.93); }
  #fullscreenBurst svg{ position:absolute; inset:0; width:100%; height:100%; }
  .fs-line{
    stroke:var(--gold);
    stroke-width:2;
    fill:none;
    stroke-linecap:round;
    opacity:0;
    transition:opacity .9s ease, stroke-dashoffset .9s ease;
  }
  .fs-line.show{ opacity:0.8; }
  .fs-dot{
    position:fixed;
    width:9px; height:9px;
    border-radius:50%;
    background:var(--gold);
    box-shadow:0 0 10px rgba(244,185,66,0.85);
    transform:translate(-50%,-50%) scale(0);
    opacity:0;
    transition:transform .8s cubic-bezier(.34,1.56,.64,1), opacity .8s ease;
  }
  .fs-dot.show{ transform:translate(-50%,-50%) scale(1); opacity:1; }

  #fsText{
    position:fixed; inset:0;
    z-index:80;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:16px;
    padding:0 34px;
    text-align:center;
    opacity:0;
    pointer-events:none;
    transition:opacity .9s ease;
  }
  #fsText.show{ opacity:1; pointer-events:auto; }
  .fs-tagline{
    font-family:'Baloo 2', sans-serif;
    font-weight:800;
    font-size:clamp(21px, 6.5vw, 27px);
    line-height:1.4;
    color:var(--cream);
    max-width:320px;
  }
  .fs-redirecting{
    font-family:'Work Sans', sans-serif;
    font-size:13px;
    color:var(--gold);
  }
  .dotdotdot::after{
    content:"";
    animation:dots 1.2s steps(4,end) infinite;
  }
  @keyframes dots{
    0%{ content:""; }
    25%{ content:"."; }
    50%{ content:".."; }
    75%{ content:"..."; }
    100%{ content:""; }
  }
  .fs-manual{
    font-family:'Work Sans', sans-serif;
    font-size:12px;
    color:var(--cream-dim);
    text-decoration:underline;
    display:none;
  }
  .fs-manual.show{ display:inline-block; }
</style>
</head>
<body>

  <div id="tapLayer">
    <p>CLICK TO<br>PLAY ME 🎮</p>
  </div>

  <div id="world">
    <div class="stars"></div>
    <div class="sparkle" style="left:12%; animation-delay:0s;">✦</div>
    <div class="sparkle" style="left:32%; animation-delay:2.5s; font-size:12px;">✧</div>
    <div class="sparkle" style="left:58%; animation-delay:5s;">✦</div>
    <div class="sparkle" style="left:78%; animation-delay:1.5s; font-size:12px;">✧</div>
    <div class="sparkle" style="left:88%; animation-delay:4s;">✦</div>
    <div class="ground"></div>
  </div>

  <main>
    <div class="blob-frame">
      <!-- Placeholder muted looping video — replace src with your real jumping video. -->
      <video autoplay loop muted playsinline>
        <source src="your-video.mp4" type="video/mp4">
      </video>
    </div>

    <div class="panel" id="gamePanel">
      <div id="gameArea">
        <h1>connect the <span>dots</span></h1>
        <p class="hint">drag from 1 to 7 — don't lift your finger</p>

        <svg id="gameSvg" viewBox="0 0 320 220" xmlns="http://www.w3.org/2000/svg">
          <line class="dot-line" data-line="1" x1="35" y1="170" x2="85" y2="60"></line>
          <line class="dot-line" data-line="2" x1="85" y1="60" x2="140" y2="150"></line>
          <line class="dot-line" data-line="3" x1="140" y1="150" x2="175" y2="45"></line>
          <line class="dot-line" data-line="4" x1="175" y1="45" x2="215" y2="130"></line>
          <line class="dot-line" data-line="5" x1="215" y1="130" x2="250" y2="40"></line>
          <line class="dot-line" data-line="6" x1="250" y1="40" x2="270" y2="115"></line>

          <g class="dot" data-num="1" transform="translate(35,170)"><circle r="17"></circle><text y="1">1</text></g>
          <g class="dot" data-num="2" transform="translate(85,60)"><circle r="17"></circle><text y="1">2</text></g>
          <g class="dot" data-num="3" transform="translate(140,150)"><circle r="17"></circle><text y="1">3</text></g>
          <g class="dot" data-num="4" transform="translate(175,45)"><circle r="17"></circle><text y="1">4</text></g>
          <g class="dot" data-num="5" transform="translate(215,130)"><circle r="17"></circle><text y="1">5</text></g>
          <g class="dot" data-num="6" transform="translate(250,40)"><circle r="17"></circle><text y="1">6</text></g>
          <g class="dot" data-num="7" transform="translate(270,115)"><circle r="17"></circle><text y="1">7</text></g>
        </svg>

        <p class="progress" id="progressText">0 / 7 connected — drag from 1</p>
      </div>
    </div>

    <div class="controls">
      <button class="sound-toggle" id="soundBtn">🔊 mute</button>
    </div>
  </main>

  <!-- shown full-screen once the dots are connected -->
  <div id="fsText">
    <p class="fs-tagline">you never know who's the dot that takes you where you want to go</p>
    <p class="fs-redirecting">connecting you now<span class="dotdotdot"></span></p>
    <a class="fs-manual" id="fsManualLink" href="#" target="_blank" rel="noopener">tap here if it doesn't open</a>
  </div>

  <!-- Background music track — add your own mp3 and it starts the moment the tap layer is dismissed. -->
  <audio id="bgAudio" src="your-song.mp3" loop></audio>

  <script>
    const LINKEDIN_URL = "https://www.linkedin.com/in/dilara-hisham-egypt";
    const svgNS = "http://www.w3.org/2000/svg";

    const tapLayer = document.getElementById('tapLayer');
    const soundBtn = document.getElementById('soundBtn');
    const audio = document.getElementById('bgAudio');
    let muted = false;

    tapLayer.addEventListener('click', () => {
      tapLayer.classList.add('hide');
      audio.play().catch(() => {});
    });

    soundBtn.addEventListener('click', () => {
      muted = !muted;
      audio.muted = muted;
      soundBtn.textContent = muted ? '🔇 unmute' : '🔊 mute';
    });

    // ---------- CONNECT THE DOTS — DRAG TO CONNECT ----------
    const svgEl = document.getElementById('gameSvg');
    const dotEls = document.querySelectorAll('.dot');
    const lineEls = document.querySelectorAll('.dot-line');
    const progressText = document.getElementById('progressText');
    const gameArea = document.getElementById('gameArea');
    const total = dotEls.length;

    lineEls.forEach(line => {
      const len = line.getTotalLength();
      line.style.strokeDasharray = len;
      line.style.strokeDashoffset = len;
      line.style.transition = 'stroke-dashoffset .3s ease';
    });

    function dotPos(num){
      const g = document.querySelector(`.dot[data-num="${num}"]`);
      const m = g.getAttribute('transform').match(/translate\(([-\d.]+),([-\d.]+)\)/);
      return { x: parseFloat(m[1]), y: parseFloat(m[2]) };
    }

    function svgPoint(evt){
      const pt = svgEl.createSVGPoint();
      pt.x = evt.clientX;
      pt.y = evt.clientY;
      return pt.matrixTransform(svgEl.getScreenCTM().inverse());
    }

    let dragging = false;
    let nextIndex = 1;
    let liveLine = null;

    function resetGame(){
      dragging = false;
      nextIndex = 1;
      dotEls.forEach(d => d.classList.remove('done'));
      lineEls.forEach(l => { l.style.strokeDashoffset = l.getTotalLength(); });
      if (liveLine) { liveLine.remove(); liveLine = null; }
      progressText.textContent = `0 / ${total} connected — drag from 1`;
    }

    document.querySelector('.dot[data-num="1"]').addEventListener('pointerdown', (e) => {
      e.preventDefault();
      resetGame();
      dragging = true;
      nextIndex = 2;
      const start = dotPos(1);
      document.querySelector('.dot[data-num="1"]').classList.add('done');
      progressText.textContent = `1 / ${total} connected`;

      liveLine = document.createElementNS(svgNS, 'line');
      liveLine.setAttribute('class', 'live-line');
      liveLine.setAttribute('x1', start.x);
      liveLine.setAttribute('y1', start.y);
      liveLine.setAttribute('x2', start.x);
      liveLine.setAttribute('y2', start.y);
      svgEl.appendChild(liveLine);

      svgEl.setPointerCapture(e.pointerId);
    });

    svgEl.addEventListener('pointermove', (e) => {
      if (!dragging) return;
      const p = svgPoint(e);
      if (liveLine) {
        liveLine.setAttribute('x2', p.x);
        liveLine.setAttribute('y2', p.y);
      }
      if (nextIndex > total) return;

      const target = dotPos(nextIndex);
      const dist = Math.hypot(p.x - target.x, p.y - target.y);

      if (dist < 24) {
        const seg = document.querySelector(`.dot-line[data-line="${nextIndex - 1}"]`);
        if (seg) seg.style.strokeDashoffset = 0;
        document.querySelector(`.dot[data-num="${nextIndex}"]`).classList.add('done');
        progressText.textContent = `${nextIndex} / ${total} connected`;

        if (liveLine) {
          liveLine.setAttribute('x1', target.x);
          liveLine.setAttribute('y1', target.y);
        }
        nextIndex++;

        if (nextIndex > total) {
          dragging = false;
          if (liveLine) { liveLine.remove(); liveLine = null; }
          progressText.textContent = `all connected!`;
          setTimeout(fireBurst, 300);
        }
      }
    });

    function endDrag(){
      if (!dragging) return;
      dragging = false;
      if (liveLine) { liveLine.remove(); liveLine = null; }
      if (nextIndex <= total) resetGame();
    }
    svgEl.addEventListener('pointerup', endDrag);
    svgEl.addEventListener('pointercancel', endDrag);

    // ---------- FULLSCREEN BURST ----------
    function fireBurst() {
      gameArea.classList.add('fading');
      setTimeout(() => { gameArea.style.display = 'none'; }, 500);

      const lastCircle = document.querySelector('.dot[data-num="7"] circle');
      const rect = lastCircle.getBoundingClientRect();
      const originX = rect.left + rect.width / 2;
      const originY = rect.top + rect.height / 2;

      const vw = window.innerWidth;
      const vh = window.innerHeight;

      const overlay = document.createElement('div');
      overlay.id = 'fullscreenBurst';
      document.body.appendChild(overlay);
      requestAnimationFrame(() => overlay.classList.add('darken'));

      const svg = document.createElementNS(svgNS, 'svg');
      svg.setAttribute('viewBox', `0 0 ${vw} ${vh}`);
      overlay.appendChild(svg);

      const rows = 6, cols = 6;
      const points = [];
      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          const jitterX = (Math.random() - 0.5) * (vw / cols) * 0.6;
          const jitterY = (Math.random() - 0.5) * (vh / rows) * 0.6;
          const x = Math.max(10, Math.min(vw - 10, (c + 0.5) / cols * vw + jitterX));
          const y = Math.max(10, Math.min(vh - 10, (r + 0.5) / rows * vh + jitterY));
          points.push({ x, y });
        }
      }
      // ripple outward from the origin, slowly
      points.sort((a, b) => {
        const da = Math.hypot(a.x - originX, a.y - originY);
        const db = Math.hypot(b.x - originX, b.y - originY);
        return da - db;
      });

      const stagger = 110; // ms between each dot lighting up — slow, deliberate

      points.forEach((p, i) => {
        const line = document.createElementNS(svgNS, 'line');
        line.setAttribute('class', 'fs-line');
        line.setAttribute('x1', originX);
        line.setAttribute('y1', originY);
        line.setAttribute('x2', p.x);
        line.setAttribute('y2', p.y);
        svg.appendChild(line);

        const dot = document.createElement('div');
        dot.className = 'fs-dot';
        dot.style.left = p.x + 'px';
        dot.style.top = p.y + 'px';
        overlay.appendChild(dot);

        setTimeout(() => {
          line.classList.add('show');
          dot.classList.add('show');
        }, stagger * i);
      });

      const totalDelay = stagger * points.length + 900;
      setTimeout(() => showResult(), totalDelay);
    }

    function showResult() {
      const fsText = document.getElementById('fsText');
      const fsManual = document.getElementById('fsManualLink');
      fsManual.href = LINKEDIN_URL;
      fsText.classList.add('show');
      setTimeout(goToLinkedIn, 2000);
    }

    function goToLinkedIn() {
      const fsManual = document.getElementById('fsManualLink');
      try {
        if (window.top) {
          window.top.location.href = LINKEDIN_URL;
          return;
        }
      } catch (e) {
        // cross-origin/sandboxed preview — fall back to opening a new tab
      }
      const opened = window.open(LINKEDIN_URL, '_blank');
      if (!opened) {
        fsManual.classList.add('show');
      }
    }
  </script>

  <!--
    ============================================
    SETUP GUIDE — do this tonight, takes ~15 min
    ============================================

    1. YOUR VIDEO
       - Short clip of yourself jumping around (5-10 sec loops fine). Keep the
         file small — under 10-15MB so it loads fast on event wifi.
       - Rename it "your-video.mp4" and put it in the SAME FOLDER as this HTML
         file (or edit the src="your-video.mp4" above to match your filename).
       - It's muted, so it autoplays everywhere without needing a tap.

    2. YOUR MUSIC
       - Pick a short, upbeat mp3 (10-20 sec loop or a full song, either loops).
       - Rename it "your-song.mp3" and put it in the same folder (or edit the
         src="your-song.mp3" above to match).

    3. YOUR LINKEDIN LINK
       - Already set to your real profile URL in the LINKEDIN_URL constant
         near the top of the <script> tag. Edit that if it ever changes.

    4. HOSTING IT LIVE TONIGHT (free, no login needed)
       - Go to https://app.netlify.com/drop
       - Drag this HTML file AND your video + mp3 files (all three together)
         into the browser window.
       - You get a live URL in seconds — that's your link.

    5. MAKE THE QR CODE
       - Copy your live Netlify URL.
       - Paste it into any free QR generator (e.g. qr-code-generator.com),
         download the QR image.
       - Screenshot it or set it as your phone lock screen so it's ready to
         show people tomorrow — no printing needed.

    6. TEST IT ON YOUR ACTUAL PHONE BEFORE THE EVENT
       - Open the live link on your phone, not your laptop.
       - Check: tap layer shows → tap it → video plays → music starts →
         drag from dot 1 through dot 7 without lifting your finger → the whole
         screen slowly fills with connected dots → tagline appears → page
         auto-redirects to your real LinkedIn.
       - IMPORTANT: the auto-redirect only works reliably once the page is
         hosted live and opened directly on a phone (step 4). It will NOT
         auto-open inside a sandboxed preview (like a chat window) — that's a
         browser security restriction, not a bug in the code.
    ============================================
  -->
</body>
</html>
